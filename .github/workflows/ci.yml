name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Five runs (BullMQ 5/6 x ioredis 5/6 x Redis 7.4/8, plus a three-master
      # Redis Cluster). Each run starts its own throwaway Redis in docker
      # (scripts/with-redis.sh, scripts/with-redis-cluster.sh) and fails if any
      # test was skipped.
      - run: pnpm test
      # The packed tarball installed into throwaway projects with ioredis 5/6,
      # BullMQ 5/6 and TypeScript 5.9/6.0/7, CJS and ESM.
      - run: pnpm run test:consumers
      - run: pnpm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-reports
          path: .jest-report*.json
          if-no-files-found: ignore
          retention-days: 7
